ticket: "modules/tickets/workflow-governance/77-acceptance-0-5-0.md (revision06)"
role: "implementation_seat"
profile: "implementation-standard"
model: "claude-sonnet-5-5"
effort: "high"
summary: "the acceptance workflow installs requirements-dev.txt before the lifecycle, the README sentence is corrected, the parity run is written down and run once, and tests pin all three"
worktree: "C:/Users/User/Desktop/Johnny_AI_Skill/.worktrees/77-acceptance (branch cp/wave3-77-acceptance)"
worktree_check: "HEAD equals 8cf1e387d38ad7a346582586f17e3f27034bb402 (the revision04 candidate) and git status --porcelain is empty before you start"
base: "f53ecc6a44e608492130e8e686284879657eb2cc"
ticket_leaf: "git show bc8da7bd:modules/tickets/workflow-governance/77-acceptance-0-5-0.md (revision06)"
ticket_leaf_note: "the worktree copy stays at revision04 and is not edited"
read_first:
  - "ticket_leaf: the Revision05 paragraph, item 7 (7a to 7e, with the indent rule after 7c), the Owner override record, TDD item 4, the revision05 mutations, L3 and D1, the boundary block and 禁止修改"
  - "ticket_leaf items 3 to 5, for what revision04 already built and what item 5 allows a seat to run"
  - ".github/workflows/ci.yml: the step Install development requirements, read only"
  - "tests/test_acceptance_lifecycle.py: the classes WorkflowTests and ReadmeTests, which read both files as text"
  - "the section after review approval and integration is control-plane and owner work: do none of it"
env:
  python: "C:/Temp/claude/jas-venv/Scripts/python.exe"
  PYTHONUTF8: "1"
  pytest_rule: "one pytest at a time in this worktree"
  full_suite_rule: "the full suite only under the host lock, with no mutation worker of yours running while you hold it"
  wait_rule: "stay in your turn while you wait for the lock or for CI"
  host_lock_acquire: "C:/Temp/claude/jas-fullsuite.lock: mkdir to acquire, then write owner.txt with your run id"
  host_lock_release: "rename the lock directory to a unique name and remove it, only if owner.txt still names your run id"
  host_lock_stale: "a lock older than 45 minutes is stale"
  p1_tests: "tests/test_acceptance_lifecycle.py tests/test_ci_registered_failures.py tests/test_tracked_path_length.py tests/test_plugin_payload_boundary.py"
  out_dir: "C:/Users/User/Desktop/Johnny_AI_Skill/.worktrees/77-acceptance-out (receipt and captures, LF, each raw block built by reading its capture file)"
  scratch: "C:/Users/User/Desktop/Johnny_AI_Skill/.worktrees/77-acceptance-scratch (disposable clones and temporary files)"
  parity_dirs: "the venv <A>, the npm prefix <B> and the run root of item 7e are new directories under C:/Temp/claude/ named with your run id, outside every Git work tree"
  candidate: "the last commit of your branch, for --candidate"
  expected_publication: "d355b4a26336cebbe4e8e28650ce0120d4c39a13"
  residue: "every directory, clone, lock and process you start carries your run id in its name"
  residue_cleanup: "before you return, remove what carries your run id and list it in the STATEMENT"
  residue_limit: "never remove anything that does not carry your run id"
  identity: "commit as Johnny Liu <johnny.liu365@gmail.com>"
writable:
  - ".github/workflows/acceptance.yml, ci/acceptance/README.md and tests/test_acceptance_lifecycle.py, inside the worktree"
  - "your parity directories and run root under C:/Temp/claude/"
prohibited:
  - "any other path, and in particular ci/acceptance/lifecycle.py, requirements-dev.txt, .github/workflows/ci.yml and the acceptance record"
  - "the user's own configuration directories, and any CLAUDE_CONFIG_DIR, CODEX_HOME or JOHNNY_ROOT outside your run root"
  - "any claude or codex command other than --version and the plugin and plugin marketplace subcommands, run through lifecycle.py"
  - "a prompt, -p, exec, a session or a login on either host"
  - "npm install --global, and any npm command other than the one line of item 7c"
  - "running or dispatching the acceptance workflow"
  - "skipping, deleting or weakening any test beyond what the ticket states"
  - "rebase, amend, reset, force or force push"
  - "Any or type: ignore"
  - "pushing any branch other than cp/wave3-77-acceptance"
  - "reading or adding secrets"
  - "asking the owner questions (return CHANGE_DETECTED with the evidence where the ticket says so)"
  - "starting a process you cannot stop"
contracts:
  - "each exact text of items 7a, 7b and 7c is written exactly as the ticket gives it"
  - "nothing else in the workflow or the README changes"
  - "before you start, copy the whole out_dir to its sibling 77-acceptance-out-rev04 and leave that copy untouched"
  - "after that copy, remove RETURN.md and RETURN.as-returned.md from out_dir, so the new receipt starts empty"
  - "an install line of item 7c that exits non-zero is a BLOCKED return naming the line and its output"
  - "a parity-run step that is not PASS is a CHANGE_DETECTED return naming the step, the command and its output"
  - "after report.jsonl is in cell L3, remove <A>, <B> and the run root, and leave the npm cache and the pip cache"
  - "a test outside the boundary that breaks is a CHANGE_DETECTED return naming the test"
  - "push this branch to run CI"
  - "add commits until one commit has both CI jobs success and no UNREGISTERED_FAILURE or REGISTERED_NOT_FAILING in either log"
cells:
  - id: "P1"
    cmd: "python -m pytest <p1_tests> -q -rfEs -p no:cacheprovider > <out_dir>/P1.txt 2>&1; echo exit=$? >> <out_dir>/P1.txt"
    assert: "exit=0 apart from registered base failures, each named if it fails: tests/test_atomic_conditional_replace_capability.py::test_acr2_linux_requires_an_actual_linux_kernel_and_backend, tests/test_plugin_payload_boundary.py::CommittedPinTests::test_the_pinned_sha_exists, tests/test_plugin_publication.py::CandidateMetadataTests::test_l5_stale_candidate_pin_is_named_before_generation, tests/test_plugin_publication.py::PublicationReachabilityTests::test_deleting_the_actual_publication_anchor_makes_the_marketplace_pin_unreachable, tests/test_plugin_publication.py::PublicationReachabilityTests::test_the_marketplace_pin_is_bound_to_the_actual_publication_anchor"
  - id: "T1"
    cmd: "python -m mypy --strict --python-version 3.11 ci/acceptance/lifecycle.py tests/test_acceptance_lifecycle.py > <out_dir>/T1.txt 2>&1; echo exit=$? >> <out_dir>/T1.txt"
    assert: "exit=0"
  - id: "L3"
    cmd: "the three install lines of item 7c, then <A>/Scripts/python.exe ci/acceptance/lifecycle.py --candidate <candidate> --expected-publication <expected_publication> --host both --steps build,fresh,upgrade,uninstall,recover,level2 --run-root <run root> with <B>/node_modules/.bin first on PATH, every command and its output appended to <out_dir>/L3.txt with echo exit=$?, then report.jsonl appended to <out_dir>/L3.txt"
    assert: "exit=0, every line of report.jsonl has verdict PASS, the generator's command names the interpreter under <A>, and every host command names a .CMD under <B>"
  - id: "M1"
    cmd: "mutations in a disposable `git clone --no-hardlinks` copy under scratch, each run with its full test file (not -x), diff and unfiltered output appended to <out_dir>/M1.txt, then restored with porcelain empty"
    mutations:
      - "the step Install development requirements removed from acceptance.yml"
      - "that step moved after the step that runs lifecycle.py"
      - "that step moved between the host-CLI step and the step that runs lifecycle.py"
      - "requirements-dev.txt in that step replaced by another file name"
      - "the words or any Python 3.11 put back into the README sentence"
      - "the section The parity run removed from the README"
      - "one package version in the README's npm install --prefix line changed"
    assert: "every mutation red, or marked equivalent with a reason"
  - id: "D1"
    cmd: "git diff --name-only 8cf1e387 <commit sha> > <out_dir>/D1.txt 2>&1; echo exit=$? >> <out_dir>/D1.txt"
    assert: "exit=0 and the list is exactly .github/workflows/acceptance.yml, ci/acceptance/README.md and tests/test_acceptance_lifecycle.py"
  - id: "C1"
    cmd: "gh run view <run id> --json headSha,conclusion,jobs,url > <out_dir>/C1.txt 2>&1; echo exit=$? >> <out_dir>/C1.txt"
    assert: "both ci.yml jobs conclusion success on the receipt's candidate sha"
  - id: "F1"
    cmd: "python -m pytest tests -q -p no:cacheprovider > <out_dir>/F1.txt 2>&1; echo exit=$? >> <out_dir>/F1.txt"
    assert: "the failure set is a subset of these registered base failures: tests/test_atomic_conditional_replace_capability.py::test_acr2_linux_requires_an_actual_linux_kernel_and_backend, tests/test_plugin_payload_boundary.py::CommittedPinTests::test_the_pinned_sha_exists, tests/test_plugin_publication.py::CandidateMetadataTests::test_l5_stale_candidate_pin_is_named_before_generation, tests/test_plugin_publication.py::PublicationReachabilityTests::test_deleting_the_actual_publication_anchor_makes_the_marketplace_pin_unreachable, tests/test_plugin_publication.py::PublicationReachabilityTests::test_the_marketplace_pin_is_bound_to_the_actual_publication_anchor (zero new red, and every other pytest running at acquisition named in the STATEMENT)"
  - id: "P9"
    cmd: "python -I -X utf8 C:/Users/User/Desktop/Johnny_AI_Skill/doc/reviews/workflow-governance/evidence/48/receipt_check.py <out_dir>/RETURN.md <worktree>"
    assert: "exit=0 (the capture is the checker run on the receipt without its P9 section, LF, after which the receipt is rebuilt with that section)"
  - id: "E1"
    cmd: "python -I -X utf8 skills/johnny-project-takeover/scripts/evidence_gate.py <out_dir>/RETURN.md --repo <worktree> --candidate <commit sha> --tool skills/johnny-project-takeover/scripts/index_pins.py --tool skills/johnny-project-takeover/scripts/receipt_fence_check.py --evidence-root <out_dir> --require-cell P1 --require-cell T1 --require-cell M1 --require-cell F1"
    assert: "exit=0 on the receipt as returned, and E1 runs last"
commits:
  - "`fix(acceptance): the workflow installs requirements-dev.txt, and the parity run is written down (ticket 77 revision05)`, with additive commits while CI is read back"
  - "last line of each commit: a Co-Authored-By trailer naming the model that actually did the work, with <noreply@anthropic.com>"
receipt:
  path: "<out_dir>/RETURN.md"
  cells_rule: "R4-7 cells, every cell at the last commit, exit in capture order, raw block equal to the file, one F1 cell"
  tool_digest_rule: "tool_digest is taken from the scripts named in E1 at the last commit"
  statement_first_lines: "`return: COMPLETED` (or BLOCKED or CHANGE_DETECTED), then `items:` with the count of STATEMENT items"
  statement_items:
    - "each exact text of items 7a, 7b and 7c, with file and line"
    - "the name of each new test, and which revision05 mutation turns it red"
    - "each verdict of L3, the interpreter and the two .CMD paths its report names, and the versions its --version records show"
    - "the npm cache and the pip cache that the install lines wrote, which stay"
    - "the residue removed and anything left, with the reason"
return:
  - "report only: receipt path, last commit sha, CI run id and URL, per-cell exit, each L3 verdict, PROCESSES_LEFT=0, and any BLOCKED or CHANGE_DETECTED items"
  - "do not merge, and do not remove the worktree"
  - "push only this ticket's branch"
timebox: "150 minutes"
