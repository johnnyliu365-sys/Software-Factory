    cmd: "python -m library.local_orchestration.plugin_publication --repo . --manifest .claude-plugin/plugin.json --marketplace .claude-plugin/marketplace.json --verify-only --ref refs/heads/publication-0.5.0 > <out_dir>/V1.txt 2>&1; echo exit=$? >> <out_dir>/V1.txt"
    assert: "exit=0 and the output names the publication commit"
