    assert: "exit=0 with the local anchor ref present, or only registered base failures, each named if it fails: tests/test_atomic_conditional_replace_capability.py::test_acr2_linux_requires_an_actual_linux_kernel_and_backend, tests/test_plugin_payload_boundary.py::CommittedPinTests::test_the_pinned_sha_exists, tests/test_plugin_publication.py::CandidateMetadataTests::test_l5_stale_candidate_pin_is_named_before_generation, tests/test_plugin_publication.py::PublicationReachabilityTests::test_deleting_the_actual_publication_anchor_makes_the_marketplace_pin_unreachable, tests/test_plugin_publication.py::PublicationReachabilityTests::test_the_marketplace_pin_is_bound_to_the_actual_publication_anchor"
  - id: "T1"
    cmd: "python -m mypy --strict --python-version 3.11 tests/test_plugin_session_hook.py tests/test_entry_read_only_lookup.py tests/test_plugin_payload_boundary.py > <out_dir>/T1.txt 2>&1; echo exit=$? >> <out_dir>/T1.txt"
