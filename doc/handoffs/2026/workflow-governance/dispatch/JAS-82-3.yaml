    cmd: "the package check of ticket item 5 in an empty directory under scratch, every command and its output appended to <out_dir>/K1.txt"
    assert: "every check of item 5 holds"
  - id: "L1"
    cmd: "the rebuilt local marketplace of ticket item 5, a recursive listing and a diff -r against the extracted package appended to <out_dir>/L1.txt"
    assert: "the plugin tree equals the extracted package and both marketplace files are unchanged"
  - id: "A1"
    cmd: "git diff --unified=0 <base> <commit sha> -- AGENTS.md .claude-plugin/plugin.json > <out_dir>/A1.txt 2>&1; echo exit=$? >> <out_dir>/A1.txt"
    assert: "only the anchor lines in AGENTS.md and the one payload line in plugin.json"
  - id: "M1"
    cmd: "mutations in a disposable `git clone --no-hardlinks` copy under scratch, each run with its full test files (not -x), diff and unfiltered output appended to <out_dir>/M1.txt, then restored with porcelain empty"
    mutations:
